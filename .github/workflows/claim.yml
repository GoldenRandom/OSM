name: Claim Boss Coins

on:
  schedule:
    - cron: '*/20 * * * *' # Runs every 20 minutes
  workflow_dispatch: # Allows you to manually click a button to run it

jobs:
  claim:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium chrome
          playwright install-deps chromium chrome
          
      - name: Run Claimer
        env:
          OSM_COOKIES: ${{ secrets.OSM_COOKIES }}
        run: xvfb-run --auto-servernum python claimer.py
