name: Claim Boss Coins

on:
  workflow_dispatch: # Allows you to manually click a button to run it

jobs:
  claim:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium chrome
          playwright install-deps chromium chrome
          
      - name: Run Claimer
        env:
          OSM_COOKIES: ${{ secrets.OSM_COOKIES }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: xvfb-run --auto-servernum python -u claimer.py
